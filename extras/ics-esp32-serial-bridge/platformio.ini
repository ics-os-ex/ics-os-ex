; ============================================================================
; ICS-OS serial bridge / boot coprocessor
;
; Target board : Waveshare ESP32-S3-LCD-1.47
;                - ESP32-S3R8N16 (16 MB flash + 8 MB OPI/octal PSRAM)
;                - Native USB Type-A port (GPIO19=D-, GPIO20=D+, no bridge chip)
;                - ST7789 172x320 SPI LCD, SD card (MMC mode), RGB LED strip
;                - Reserved UART0 header (TXD=GPIO43, RXD=GPIO44) — R6/R7
;                  must be soldered (see README.md, "Soldering R6/R7")
;
; Purpose      : Sits between the host PC (native USB CDC) and a target ICS-OS
;                machine. It captures the target's COM1 (115200 8N1) boot log
;                on its UART0 and mirrors it to:
;                  * the host over USB CDC (`Serial`)
;                  * the onboard 172x320 LCD (live scrolling console)
;                  * an SD card in the TF slot (persistent capture)
;                Host keyboard input on the CDC port is echoed to the target
;                COM1 RX (GPIO43) so the GRUB/IPL shell is still reachable.
;
; Build:  pio run -d extras/ics-esp32-serial-bridge
; Flash:  pio run -d extras/ics-esp32-serial-bridge -t upload
;          (hold BOOT, tap RESET, release BOOT to force download mode if the
;           port is not auto-detected; then release)
; ============================================================================

[env:esp32s3]
platform = espressif32
board = waveshare_esp32s3_lcd147
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; USB CDC serial (Serial) is the native USB port — no USB port pin needed.
; (board json sets ARDUINO_USB_MODE=1 / ARDUINO_USB_CDC_ON_BOOT=1)
build_flags =
    -O2
    -DCONFIG_ICS_BRIDGE=1
; 16 MB flash: keep the stock 4D-style 16MB partition layout (app0 6.4MB).
; (board json sets partitions default_16MB.csv)
lib_deps =
